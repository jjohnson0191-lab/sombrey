workflows:
  sombrey-mobile-ios:
    name: Sombrey Mobile — iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2

    # App Store Connect API key integration, configured in Codemagic
    # under Team settings → Integrations → App Store Connect, named
    # "Sombrey Codemagic". This is what fetch-signing-files,
    # use-profiles, and the app_store_connect publishing block below
    # all authenticate with — none of those credentials live in this
    # repo.
    integrations:
      app_store_connect: "Sombrey Codemagic"

    environment:
      # Explicit, manually-uploaded signing assets (Team settings →
      # Code signing identities), referenced by name — not fetched via
      # the App Store Connect API. This is deliberate: the bundle ID
      # previously matched two different App Store profiles (one
      # API-created, one manually uploaded), which was ambiguous.
      # Referencing this exact profile removes that ambiguity.
      ios_signing:
        provisioning_profiles:
          - Sombrey_App_Store.mobileprovision
        certificates:
          - sombrey_distribution

      # Create this group in Codemagic (Team settings → Environment
      # variable groups) with VITE_CONVEX_URL and VITE_CLERK_PUBLISHABLE_KEY
      # as secure variables — the same two values apps/mobile/.env.local
      # holds locally. Never commit that file; this group is its CI
      # equivalent. Vite reads VITE_-prefixed vars straight from the
      # process environment at build time, so no .env file is written
      # here.
      groups:
        - sombrey_mobile
      vars:
        XCODE_WORKSPACE: "apps/mobile/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.sombrey.app"
      node: 20.18.0
      xcode: latest
      cocoapods: default

    # TEMPORARILY DISABLED for the Phase 0.5 native-iOS build-validation
    # push: this workflow's trigger isn't scoped to specific paths, so an
    # unscoped push-to-main here would also auto-submit a redundant
    # Capacitor build to TestFlight, which wasn't asked for. Re-enable by
    # restoring the block below once the native validation push is done.
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: main
    #       include: true
    #       source: true

    scripts:
      - name: Install pnpm (matches the committed lockfile version)
        script: |
          corepack disable
          npm install -g pnpm@9
          pnpm --version

      - name: Install workspace dependencies
        script: pnpm install --frozen-lockfile

      - name: Convex codegen
        script: |
          npx convex codegen --typecheck disable
        # Generates convex/_generated/* from the current function/schema
        # source so apps/mobile's @convex/_generated/api.js imports
        # resolve. Not committed (see .gitignore) — regenerated on every
        # build instead. --typecheck disable skips Convex's own strict
        # check here; the mobile TypeScript build below still checks
        # everything that actually consumes these types.
        # Requires CONVEX_DEPLOY_KEY in the sombrey_mobile environment
        # group (Convex dashboard → Settings → Deploy Keys) for
        # non-interactive auth — this step fails without it.

      - name: Build the Sombrey mobile web bundle
        script: |
          cd apps/mobile
          pnpm build

      - name: Capacitor sync (copies the web build into the iOS project)
        script: |
          cd apps/mobile
          pnpm cap:sync

      - name: CocoaPods install
        script: |
          cd apps/mobile/ios/App
          pod install

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles --project "apps/mobile/ios/App/App.xcodeproj"

      - name: Diagnose code signing assignment (no secrets printed)
        script: |
          xcodebuild -showBuildSettings \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            | grep -E "PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE"

      - name: Build the .ipa
        script: |
          cd apps/mobile/ios/App
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - apps/mobile/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  sombrey-native-ios:
    name: Sombrey Native iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2

    # Same App Store Connect integration as sombrey-mobile-ios — one Apple
    # Developer team (9H99MBY3C8), one bundle ID (com.sombrey.app), used by
    # both the retired Capacitor app and this native rewrite.
    integrations:
      app_store_connect: "Sombrey Codemagic"

    environment:
      # Dedicated App Store profile for the native target: "Sombrey Native
      # App Store" (App ID com.sombrey.app), created specifically because
      # the shared "Sombrey App Store" profile the Capacitor workflow uses
      # doesn't include the Sign in with Apple capability/entitlement this
      # target requires. Same team/certificate, separate profile.
      ios_signing:
        provisioning_profiles:
          - Sombrey_Native_App_Store
        certificates:
          - sombrey_distribution

      # Create this group in Codemagic (Team settings -> Environment
      # variable groups) with CLERK_PUBLISHABLE_KEY as a secure variable —
      # the same pk_test_... value already used by the sombrey_mobile
      # group's VITE_CLERK_PUBLISHABLE_KEY (same Clerk dev instance, per
      # explicit instruction not to create another Clerk application).
      groups:
        - sombrey_native_ios
      vars:
        XCODE_PROJECT: "apps/ios/SombreyApp.xcodeproj"
        XCODE_SCHEME: "SombreyApp"
        BUNDLE_ID: "com.sombrey.app"
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Write Clerk publishable key into Secrets.xcconfig (never committed)
        script: |
          echo "CLERK_PUBLISHABLE_KEY = $CLERK_PUBLISHABLE_KEY" > apps/ios/Secrets.xcconfig
        # Mirrors how sombrey-mobile-ios never writes an .env file and
        # instead lets Vite read process env directly — here the native
        # build needs an actual xcconfig file on disk (see
        # ConvexClientProvider.swift / Info.plist's $(CLERK_PUBLISHABLE_KEY)
        # substitution), so this step recreates apps/ios/Secrets.xcconfig
        # from the CI secret instead of committing it.

      - name: Resolve Swift package dependencies
        script: |
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Diagnose code signing assignment (no secrets printed)
        script: |
          xcodebuild -showBuildSettings \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            | grep -E "PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|IPHONEOS_DEPLOYMENT_TARGET|SWIFT_VERSION"

      - name: Build the .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ── Development / test build of the SAME Sombrey app ─────────────────────
  # Same app, target, scheme, bundle ID (com.sombrey.app) and signing as
  # sombrey-native-ios — the only difference is the backend: this build's
  # Convex deployment is the DEVELOPMENT one (adamant-chicken-676), injected
  # through the existing Secrets.xcconfig → SOMBREY_CONVEX_URL → Info.plist
  # (SombreyConvexDeploymentURL) path read by ConvexClientProvider. The app
  # shows "· DEV adamant-chicken-676" beside its version in Settings.
  #
  # Manual start only (no triggering). It never runs Convex CLI commands, so
  # it can't deploy or touch production data. It uploads to TestFlight for
  # internal testing — not an App Store release.
  sombrey-body-scan-5a-dev:
    name: Sombrey Body Scan Dev (5A–5F, dev backend)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Sombrey Codemagic"

    environment:
      ios_signing:
        provisioning_profiles:
          - Sombrey_Native_App_Store
        certificates:
          - sombrey_distribution
      groups:
        - sombrey_native_ios
      vars:
        XCODE_PROJECT: "apps/ios/SombreyApp.xcodeproj"
        XCODE_SCHEME: "SombreyApp"
        BUNDLE_ID: "com.sombrey.app"
        # The development deployment. xcconfig treats "//" as a comment, so
        # it's written as https:/$()/… below.
        DEV_CONVEX_HOST: "adamant-chicken-676.convex.cloud"
      xcode: latest

    scripts:
      - name: Toolchain (Xcode / Swift versions)
        script: |
          xcodebuild -version
          swift --version

      - name: Write Secrets.xcconfig (Clerk key + DEVELOPMENT Convex URL)
        script: |
          {
            echo "CLERK_PUBLISHABLE_KEY = $CLERK_PUBLISHABLE_KEY"
            echo "SOMBREY_CONVEX_URL = https:/\$()/$DEV_CONVEX_HOST"
          } > apps/ios/Secrets.xcconfig
          grep -c "^CLERK_PUBLISHABLE_KEY = " apps/ios/Secrets.xcconfig
          grep "^SOMBREY_CONVEX_URL" apps/ios/Secrets.xcconfig

      - name: Resolve Swift package dependencies
        script: |
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Confirm the build setting resolves to the dev deployment
        script: |
          xcodebuild -showBuildSettings -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Release \
            | grep -E "SOMBREY_CONVEX_URL|PRODUCT_BUNDLE_IDENTIFIER|CURRENT_PROJECT_VERSION|SWIFT_VERSION"

      - name: Swift unit tests on the simulator (informational)
        # Runs SombreyAppTests (incl. BodyScanTests). Doesn't block the build:
        # a device-only SDK in the app target can stop a simulator build.
        ignore_failure: true
        script: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "Simulator: $SIM"
          set -o pipefail
          xcodebuild test -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -destination "id=$SIM" \
            -only-testing:SombreyAppTests CODE_SIGNING_ALLOWED=NO 2>&1 | tee unit-tests.log | grep -E "Test (case|Suite)|✔|✘|passed|failed|error:" | tail -200

      - name: Build the .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

      - name: Verify the compiled app targets the DEVELOPMENT backend (fails otherwise)
        script: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          unzip -p "$IPA" 'Payload/*.app/Info.plist' > /tmp/SombreyInfo.plist
          URL=$(/usr/libexec/PlistBuddy -c "Print :SombreyConvexDeploymentURL" /tmp/SombreyInfo.plist)
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /tmp/SombreyInfo.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" /tmp/SombreyInfo.plist)
          echo "Compiled app: $VERSION ($BUILD) → Convex $URL"
          test "$URL" = "https://$DEV_CONVEX_HOST"
          echo "DEV BUILD — Sombrey Body Scan 5F (history, visual comparison, proportion trends, image controls, larger framing). For the consolidated Phase 5 evaluation. Nothing validated. Backend: development Convex ($DEV_CONVEX_HOST), not production. Not for release." > release_notes.txt

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - unit-tests.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
